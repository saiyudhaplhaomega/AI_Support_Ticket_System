<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOAVIA Support (Safe local demo)</title><style>body{font:16px system-ui;max-width:52rem;margin:3rem auto;padding:1rem;line-height:1.45}label{display:block;margin:1rem 0 .3rem}input,textarea{box-sizing:border-box;width:100%;padding:.6rem}button{margin-top:1rem;padding:.7rem 1rem}.notice{padding:.8rem;background:#eef6ff;border-left:4px solid #2671c9}#result{margin-top:1rem;font-weight:600}.error{color:#a40000}#demo-result{margin-top:1.5rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fa;padding:1rem;border-radius:.25rem}dt{font-weight:700}dd{margin:0 0 1rem}</style></head><body>
<h1>NOAVIA Support</h1><p class="notice"><strong>Safe local demo.</strong> The submitted details are validated locally and discarded. Demo mode never contacts Gmail, Google Sheets, n8n, model providers, or Qdrant.</p>
<form id="ticket"><label>Name<input name="name" required maxlength="120"></label><label>Email<input name="email" type="email" required></label><label>Subject<input name="subject" required maxlength="240"></label><label>Message<textarea name="message" required maxlength="20000"></textarea></label><label>Optional PDF<input name="attachment" type="file" accept="application/pdf,application/x-pdf"></label><button>Submit demo ticket</button></form><p id="result" role="status" aria-live="polite"></p>
<section id="demo-result" hidden aria-labelledby="demo-title"><h2 id="demo-title">Deterministic demo processing result</h2><p>The reply below is an internal draft only. It has not been sent.</p><dl id="demo-fields"></dl></section>
<script>
const form=document.querySelector('#ticket'),result=document.querySelector('#result'),demoResult=document.querySelector('#demo-result'),fields=document.querySelector('#demo-fields'),pdfTypes=new Set(['application/pdf','application/x-pdf']);
const labels={classification:'Mock classification JSON',rag:'Top-3 RAG sources and fallback decision',routing:'Routing decision',manual_review:'Manual-review status',processing_log:'Processing log',internal_draft_reply:'Internal-draft-only reply'};
function showError(message){result.className='error';result.textContent=message;demoResult.hidden=true}
function renderDemo(demo){fields.replaceChildren();for(const[key,label]of Object.entries(labels)){const term=document.createElement('dt');term.textContent=label;const description=document.createElement('dd'),output=document.createElement('pre');output.textContent=JSON.stringify(demo[key],null,2);description.append(output);fields.append(term,description)}demoResult.hidden=false}
form.onsubmit=async event=>{event.preventDefault();const attachment=form.attachment.files[0];if(attachment&&!pdfTypes.has(attachment.type))return showError('Attachment must be a PDF.');if(attachment&&attachment.size>10*1024*1024)return showError('Attachment must be 10 MB or smaller.');const payload=Object.fromEntries(new FormData(form));if(attachment){payload.attachment_name=attachment.name;payload.attachment_type=attachment.type;payload.attachment_base64=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.readAsDataURL(attachment)})}result.className='';result.textContent='Submitting demo ticket…';demoResult.hidden=true;try{const response=await fetch('/api/tickets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}),data=await response.json();if(!response.ok||!data.ok)return showError(data.detail||data.message||'Unable to submit the demo ticket.');result.textContent=`${data.message} Ticket: ${data.ticket_id}.`;renderDemo(data.demo);form.reset()}catch(_){showError('Unable to reach the local demo server. Please try again.')}};
</script></body></html>
