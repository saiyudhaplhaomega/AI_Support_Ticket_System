<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOAVIA Support — Test Mode</title><body><main><h1>NOAVIA Support Ticket</h1><p><strong>Test mode only.</strong> Dummy data only; no customer email is sent.</p><form id="ticket"><label>Name <input name="name" required></label><label>Email <input name="email" type="email" required></label><label>Subject <input name="subject" required></label><label>Message <textarea name="message" required></textarea></label><label>Optional PDF <input name="attachment" type="file" accept="application/pdf"></label><button>Submit test ticket</button></form><p id="result" role="status"></p></main><script>document.querySelector('#ticket').addEventListener('submit',async e=>{e.preventDefault();const r=document.querySelector('#result'),f=new FormData(e.target);const pdf=f.get('attachment');if(pdf&&pdf.size&&pdf.type!=='application/pdf'){r.textContent='Attachment must be a PDF.';return}r.textContent='Submitting test ticket…';try{const x=await fetch('/api/tickets',{method:'POST',body:f}),j=await x.json();r.textContent=x.ok?j.message:(j.detail||'Submission failed.')}catch(_){r.textContent='Submission failed.'}})</script><style>body{font:16px system-ui;max-width:42rem;margin:3rem auto;padding:0 1rem}label{display:block;margin:1rem 0}input,textarea{display:block;width:100%;max-width:36rem;padding:.5rem}textarea{min-height:8rem}button{padding:.6rem 1rem}</style></body></html>
