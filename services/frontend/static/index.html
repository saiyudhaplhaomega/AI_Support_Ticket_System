<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOAVIA Support (Test)</title><style>body{font:16px system-ui;max-width:42rem;margin:3rem auto;padding:1rem}label{display:block;margin:1rem 0 .3rem}input,textarea{box-sizing:border-box;width:100%;padding:.6rem}button{margin-top:1rem;padding:.7rem 1rem}#result{margin-top:1rem}</style></head><body><h1>NOAVIA Support</h1><p>Test mode: dummy data only. No email is sent and no ticket is written to a live system.</p><form id="ticket"><label>Name<input name="name" required maxlength="120"></label><label>Email<input name="email" type="email" required></label><label>Subject<input name="subject" required maxlength="240"></label><label>Message<textarea name="message" required maxlength="20000"></textarea></label><label>Optional PDF<input name="attachment" type="file" accept="application/pdf"></label><button>Submit test ticket</button></form><p id="result" role="status"></p><script>document.querySelector('#ticket').onsubmit=async e=>{e.preventDefault();const r=document.querySelector('#result'),f=e.target,a=f.attachment.files[0],p=Object.fromEntries(new FormData(f));if(a){p.attachment_name=a.name;p.attachment_type=a.type;p.attachment_base64=await new Promise(ok=>{const x=new FileReader;x.onload=()=>ok(x.result.split(',')[1]);x.readAsDataURL(a)})}r.textContent='Submitting…';const x=await fetch('/api/tickets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)}),d=await x.json();r.textContent=d.message||(d.detail||'Unable to submit.');if(d.ok)e.target.reset()};</script></body></html>
