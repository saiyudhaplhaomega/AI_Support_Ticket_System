# Local learning stack — n8n + Qdrant only, no reverse proxy, no auth.
# Separate from docker-compose.yml (the production baseline). Use this while
# you build and test the workflow by hand in the n8n UI.
#
# Start:  docker compose -f docker-compose.local.yml up -d
# Stop:   docker compose -f docker-compose.local.yml down
# Wipe:   docker compose -f docker-compose.local.yml down -v   (deletes data too)

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.34.5
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      # Read-only source material for the native n8n KB ingestion workflow.
      # The workflow reads /files/noavia/*.md and never writes into the repo.
      - ./knowledge-base/noavia:/files/noavia:ro
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
  qdrant_data:
